name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,dev]'
      - name: Pytest
        run: pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - name: Smoke CLI offline
        run: |
          supersocks-media-scraper --version
          supersocks-media-scraper 'https://example.com/' >/tmp/sms.json || true
          python -c 'import json; p=json.load(open("/tmp/sms.json")); assert p["status"]=="error"; assert "user:" not in json.dumps(p).lower()'
